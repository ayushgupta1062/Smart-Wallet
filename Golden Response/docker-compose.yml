services:
  # MySQL Database container
  mysql-db:
    image: mysql:8.0
    container_name: expense_tracker_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_tracker
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - expense-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot REST API
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=expense_tracker
      - DB_USER=root
      - DB_PASSWORD=root
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION=86400000
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - expense-network

  # Nginx React Frontend SPA
  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: expense_tracker_ui
    ports:
      - "80:80"
    depends_on:
      - backend-api
    networks:
      - expense-network

networks:
  expense-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
